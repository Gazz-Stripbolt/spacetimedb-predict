name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript
        run: |
          npm run build:web
          npm run typecheck
      - name: Package contents
        working-directory: client
        run: npm pack --dry-run

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The installer gives the latest GitHub release, which can lag the crates/npm/NuGet release.
          "$HOME/.local/bin/spacetime" version install 2.14.0 && "$HOME/.local/bin/spacetime" version use 2.14.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: npm run build:web
      - name: Publish the demo module
        run: spacetime publish -s local -y predict -p demo/module --delete-data
      - name: Behaviour tests (through a +150 ms proxy)
        run: npx tsx tests/predict.test.mts 2>&1 | grep -v 'INFO Connecting'
      - name: Browser tests
        run: |
          spacetime publish -s local -y predict -p demo/module --delete-data
          npx tsx tests/browser.test.mts 2>&1 | grep -v 'INFO Connecting'
      - name: Benchmark (overlay rebuild cost)
        run: npx tsx tests/bench.mts
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true

  csharp:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: C# (console client; TS module + shared-logic C# module)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: npm ci
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The installer gives the latest GitHub release, which can lag the crates/npm/NuGet release.
          "$HOME/.local/bin/spacetime" version install 2.14.0 && "$HOME/.local/bin/spacetime" version use 2.14.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: npm run build:web
      - name: Library builds for netstandard2.1 (Unity)
        run: dotnet build csharp/SpacetimeDB.Predict -c Release
      - name: Tests (through a +150 ms proxy)
        run: scripts/test-cs.sh
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true

  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: Rust (console client; TS module + shared-logic Rust module)
    steps:
      - uses: actions/checkout@v5
      - name: Rust toolchain (+ wasm32 for the module)
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown --component clippy,rustfmt
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rust
            demo/rust
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: |
          (cd rust && cargo fmt --all --check && cargo clippy --all-targets -- -D warnings)
          (cd demo/rust && cargo fmt --all --check && cargo clippy --release --target wasm32-unknown-unknown -p predict_demo_rs -- -D warnings)
      - name: Install SpacetimeDB CLI
        run: |
          curl -sSf https://install.spacetimedb.com | sh -s -- --yes
          # The installer gives the latest GitHub release, which can lag the crates/npm/NuGet release.
          "$HOME/.local/bin/spacetime" version install 2.14.0 && "$HOME/.local/bin/spacetime" version use 2.14.0
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Start SpacetimeDB
        run: |
          nohup spacetime start --in-memory --listen-addr 127.0.0.1:3000 --non-interactive > server.log 2>&1 &
          for i in $(seq 60); do curl -sf -o /dev/null http://127.0.0.1:3000/v1/ping && break; sleep 1; done
      - run: npm run build:web
      - name: Tests (through a +150 ms proxy)
        run: scripts/test-rs.sh
      - name: Server log
        if: failure()
        run: tail -n 200 server.log || true
